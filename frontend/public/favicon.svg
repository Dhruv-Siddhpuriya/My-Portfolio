<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Rich glowing gradients -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep dark futuristic background -->
  <rect width="100" height="100" rx="16" fill="#050511" />

  <!-- Outer glowing neon hexagon -->
  <polygon
    points="50,12 85,30 85,70 50,88 15,70 15,30"
    fill="#08081a"
    stroke="url(#logoGrad)"
    stroke-width="4.5"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Main "D" & bracket emblem -->
  <g filter="url(#glow)">
    <!-- Stylized D contour -->
    <path
      d="M38,34 L58,34 C67,34 67,66 58,66 L38,66 Z"
      fill="none"
      stroke="url(#logoGrad)"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Terminal Prompt Chevron -->
    <path
      d="M38,42 L48,50 L38,58"
      fill="none"
      stroke="#60a5fa"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Underline Prompt Cursor -->
    <line
      x1="50" y1="61" x2="61" y2="61"
      stroke="#a78bfa"
      stroke-width="5"
      stroke-linecap="round"
    />
  </g>
</svg>